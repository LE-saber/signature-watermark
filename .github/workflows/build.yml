name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-22.04        # Older glibc for wider Linux compatibility
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps blind-watermark==0.4.4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build portable archive
        run: python packaging/build.py

      - name: Smoke-test the frozen app (CLI)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/SigWatermark.app/Contents/MacOS/SigWatermark;
          elif [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/SigWatermark/SigWatermark.exe;
          else BIN=dist/SigWatermark/SigWatermark; fi
          "$BIN" --help

      - uses: actions/upload-artifact@v4
        with:
          name: SigWatermark-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate archive checksums
        working-directory: artifacts
        run: sha256sum SigWatermark-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: SigWatermark ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: artifacts/*
